services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: roomplannr
      POSTGRES_USER: roomplannr
      POSTGRES_PASSWORD: roomplannr_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roomplannr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomplannr -d roomplannr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  roomplannr_pg_data:
